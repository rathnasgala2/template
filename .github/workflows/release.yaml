name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/core/**
      - contracts/**
      - types/**
      - LICENSE
      - README.md
      - package.json
      - package-lock.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package the declared version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run verify

      - name: Build the package artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload the package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-package-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90
